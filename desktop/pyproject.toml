[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ceo-assistant-desktop"
version = "0.1.0"
description = "Desktop voice client for the voice-first Chief of Staff assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=14,<16",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Wake word, local speech-to-text, Piper text-to-speech, audio I/O, global hotkey.
voice = [
  "openwakeword>=0.6,<0.7",
  "faster-whisper>=1.0,<2",
  "piper-tts>=1.2,<2",
  "sounddevice>=0.4.6,<1",
  "pynput>=1.7,<2",
]
# Alternative text-to-speech engine.
kokoro = [
  "kokoro>=0.9,<1",
]
# System tray icon (Windows and macOS).
tray = [
  "pystray>=0.19,<1",
  "pillow>=10",
]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
assistant-desktop = "assistant_desktop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["assistant_desktop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["assistant_desktop"]

[[tool.mypy.overrides]]
module = [
  "openwakeword.*",
  "faster_whisper.*",
  "piper.*",
  "kokoro.*",
  "sounddevice.*",
  "pynput.*",
  "pystray.*",
  "PIL.*",
  "PyInstaller.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=assistant_desktop --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["assistant_desktop"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
