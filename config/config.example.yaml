# Copy to config/config.yaml and edit. Every key is optional; defaults are shown.
timezone: Asia/Kolkata

brief_times:
  morning: "08:00"
  evening: "18:30"

# Which integrations are enabled.
adapters:
  calendar: [google]        # google | microsoft
  email: [google]           # google | microsoft
  tasks: [jira]             # jira | asana | clickup
  notify: [email, telegram] # email | telegram | slack | teams

ingest:
  days_ahead: 1            # today + tomorrow
  email_lookback_hours: 48 # first email sync looks back this far
  include_email: true      # flagged/starred emails become items

briefing:
  max_spoken_seconds: 45 # longer briefs are trimmed; "tell me more" has the rest
  words_per_minute: 150

scheduler:
  sync_interval_minutes: 15 # background sync + P1 alerts; 0 turns it off

models:
  bulk: claude-haiku-5-5          # scoring and classification
  conversation: claude-sonnet-5-5 # dialogue, delegation briefs, hard calls
  bulk_effort: low                # low | medium | high | xhigh | max
  conversation_effort: medium
  max_retries: 3                  # SDK retries on 429, 5xx and connection errors
  refusal_fallback: true          # retry a refused conversation call on a fallback model

budget:
  monthly_usd: 20.0 # above this, scoring falls back to rules only

# What you call the assistant. The phone and desktop apps listen for it ("Atlas, brief me").
assistant_name: Atlas

wake_word:
  phrase: atlas
  push_to_talk_hotkey: ctrl+alt+space

stt:
  engine: faster-whisper
  model_size: small
  compute_type: int8
  language: null # auto-detect

tts:
  engine: piper # piper | kokoro
  voice: en_US-lessac-medium
