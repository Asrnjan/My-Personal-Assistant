name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Tests
        run: pytest

  desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest

  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-pwa/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npx playwright test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f backend/Dockerfile --build-arg EXTRAS=dev -t assistant .
      - name: Smoke test
        run: |
          docker run -d --name assistant -p 8000:8000 \
            -e API_AUTH_TOKEN=ci-secret -e DATABASE_URL=sqlite:////data/assistant.db assistant
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health | grep '"database":"ok"'
          curl -fs http://127.0.0.1:8000/ | grep -i "<html"
          curl -fs -X POST http://127.0.0.1:8000/auth/token -H 'content-type: application/json' \
            -d '{"secret":"ci-secret","client_name":"ci"}' | grep access_token
          docker run --rm assistant python /app/scripts/generate_vapid_keys.py | grep VAPID_PRIVATE_KEY
      - name: Logs
        if: failure()
        run: docker logs assistant

  # Atlas started the way a Windows user starts it: Start Atlas.bat runs scripts\start.ps1.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First run (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\start.ps1 -SetupOnly
      - name: Start, answer and sign in
        shell: powershell
        run: |
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', '"Start Atlas.bat" -NoBrowser' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:8000/health -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "Atlas did not start" }
          $health = Invoke-RestMethod http://127.0.0.1:8000/health
          if ($health.database -ne 'ok') { throw "database: $($health.database)" }
          $secret = (Select-String -Path .env -Pattern '^API_AUTH_TOKEN=(.+)$').Matches[0].Groups[1].Value
          $body = @{ secret = $secret; client_name = 'ci' } | ConvertTo-Json
          $token = (Invoke-RestMethod -Method Post http://127.0.0.1:8000/auth/token -ContentType 'application/json' -Body $body).access_token
          $apps = Invoke-RestMethod http://127.0.0.1:8000/connections -Headers @{ Authorization = "Bearer $token" }
          if (-not $apps.ready) { throw "connections not ready" }
          $page = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($page.Content -notmatch 'Chief of Staff') { throw "app page missing" }

          # iPhone voice: Windows speaks a sentence, it is saved as AAC in MP4 like an
          # iPhone recording, and /stt must hear the words back.
          Add-Type -AssemblyName System.Speech
          $wav = Join-Path $env:RUNNER_TEMP 'say.wav'
          $m4a = Join-Path $env:RUNNER_TEMP 'say.m4a'
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile($wav)
          $voice.Speak('Brief me about my day.')
          $voice.Dispose()
          & backend\.venv\Scripts\python.exe scripts\ci\to_m4a.py $wav $m4a
          if ($LASTEXITCODE -ne 0) { throw "could not make the m4a" }
          $heard = curl.exe -s -f -H "Authorization: Bearer $token" -F "audio=@$m4a;type=audio/mp4" http://127.0.0.1:8000/stt
          if ($LASTEXITCODE -ne 0) { throw "/stt failed" }
          Write-Host "Heard: $heard"
          if ((($heard | ConvertFrom-Json).text) -notmatch 'brief') { throw "/stt did not hear 'brief'" }

          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Backend tests on Windows
        working-directory: backend
        run: |
          # The launcher's .env (secret and encryption key) would leak into the tests' settings.
          Remove-Item ..\.env
          pip install -e ".[dev]"
          pytest -q
