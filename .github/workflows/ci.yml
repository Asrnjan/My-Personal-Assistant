name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Tests
        run: pytest

  desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest

  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-pwa/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npx playwright test
